    <script>
      (function () {
        var blockClip = function (e) {
          if (e && e.clipboardData) {
            try {
              e.clipboardData.setData('text/plain', '');
              e.clipboardData.setData('text/html', '');
              e.clipboardData.clearData();
            } catch (_) {}
          }
          try {
            if (window.getSelection) {
              var sel = window.getSelection();
              if (sel && sel.removeAllRanges) sel.removeAllRanges();
            }
          } catch (_) {}
          if (e) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopPropagation) e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
          return false;
        };
        var blockBeforeInput = function (e) {
          var t = e && e.inputType ? String(e.inputType) : '';
          if (
            t === 'insertFromPaste' ||
            t === 'insertFromPasteAsQuotation' ||
            t === 'insertFromDrop' ||
            t === 'insertFromYank' ||
            t === 'deleteByCut' ||
            t === 'deleteByDrag'
          ) {
            return blockClip(e);
          }
        };
        var blockKeys = function (e) {
          if (!e) return;
          var k = String(e.key || '').toUpperCase();
          var c = String(e.code || '').toUpperCase();
          var kc = e.keyCode || e.which;
          if (
            ((e.ctrlKey || e.metaKey) &&
              !e.altKey &&
              (k === 'C' || k === 'V' || k === 'X' || k === 'INSERT' ||
               c === 'KEYC' || c === 'KEYV' || c === 'KEYX' || c === 'INSERT' ||
               kc === 67 || kc === 86 || kc === 88 || kc === 45)) ||
            (e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey && (k === 'INSERT' || c === 'INSERT' || kc === 45))
          ) {
            return blockClip(e);
          }
        };
        ['copy', 'cut', 'paste', 'dragstart', 'drop'].forEach(function (ev) {
          window.addEventListener(ev, blockClip, { capture: true });
          document.addEventListener(ev, blockClip, { capture: true });
        });
        window.addEventListener('beforeinput', blockBeforeInput, { capture: true });
        document.addEventListener('beforeinput', blockBeforeInput, { capture: true });
        window.addEventListener('keydown', blockKeys, { capture: true });
        document.addEventListener('keydown', blockKeys, { capture: true });
      })();
